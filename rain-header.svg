        0%   { transform: translateY(-40px); opacity: 0; }
        12%  { opacity: 0.55; }
        88%  { opacity: 0.55; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      .title { fill: #e6edf3; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 700; }
      .sub   { fill: #8b949e; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; letter-spacing: 4px; }
    </style>
  </defs>

